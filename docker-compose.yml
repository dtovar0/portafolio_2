version: '3.8'

services:
  app:
    build: .
    container_name: nexus_app_dev
    restart: always
    ports:
      - "${PORT_APP:-5000}:5000"
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - REDIS_HOST=${REDIS_HOST:-redis}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - ./logs:/app/logs
      - /home/ftp_packet:/app/storage/fortigate
    depends_on:
      - redis
    networks:
      - nexus_net

  redis:
    image: redis:7-alpine
    container_name: nexus_redis_dev
    restart: always
    ports:
      - "6381:6379"
    networks:
      - nexus_net

networks:
  nexus_net:
    driver: bridge
