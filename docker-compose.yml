services:
  app:
    build: .
    container_name: nexus_drive_app
    restart: always
    ports:
      - "${PORT_APP:-5000}:5000"
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST:-localhost}
      - REDIS_HOST=${REDIS_HOST:-redis}
    depends_on:
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./.env:/app/.env

  redis:
    image: redis:7-alpine
    container_name: nexus_drive_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
