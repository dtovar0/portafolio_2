services:
  app:
    build: .
    container_name: nexus_drive_app
    restart: always
    ports:
      - "${PORT_APP:-5000}:5000"
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST:-db}
      - REDIS_HOST=${REDIS_HOST:-redis}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./.env:/app/.env


  db:
    image: mariadb:10.11
    container_name: nexus_drive_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-password}
      MYSQL_DATABASE: ${DB_NAME:-admin_test}
      MYSQL_USER: ${DB_USER:-username}
      MYSQL_PASSWORD: ${DB_PASS:-password}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus_drive_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
