# Nexus tras Authelia.
#
# Reparto: el frontend Next.js sirve la interfaz; Flask atiende la API, el
# login y los assets del portal antiguo mientras convivan.

upstream nexus_api {
    server 127.0.0.1:5001;
    keepalive 16;
}

upstream nexus_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name nexus.example.com;

    # ssl_certificate     /etc/ssl/certs/nexus.crt;
    # ssl_certificate_key /etc/ssl/private/nexus.key;

    client_max_body_size 64m;

    # Cabeceras que Authelia inyecta y que Flask lee para el SSO.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Remote-Email      $http_remote_email;
    proxy_set_header Remote-Name       $http_remote_name;
    proxy_set_header Remote-Groups     $http_remote_groups;

    # --- Backend Flask -----------------------------------------------------
    # La API y la autenticación. La cookie de sesión se emite aquí, y como todo
    # se sirve bajo el mismo dominio, el frontend la envía sin CORS.
    location /api/ {
        proxy_pass http://nexus_api;
        proxy_http_version 1.1;
    }

    location /auth/ {
        proxy_pass http://nexus_api;
        proxy_http_version 1.1;
    }

    # Portal Jinja antiguo: mantener solo hasta retirar las vistas heredadas.
    location /static/ {
        proxy_pass http://nexus_api;
        expires 7d;
    }

    # --- Frontend Next.js --------------------------------------------------
    location /_next/static/ {
        proxy_pass http://nexus_web;
        proxy_http_version 1.1;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://nexus_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
